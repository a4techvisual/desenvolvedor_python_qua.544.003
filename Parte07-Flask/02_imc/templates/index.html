<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC | Índice de Massa Corporal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #171717;
            font-family: Arial, sans-serif;
        }
        .container {
            width: min(850px, 94%);
            padding: 28px;
            background: #f4f4f4;
            border: 6px solid #111;
            box-shadow: 8px 8px 0 #000;
            text-align: center;
        }
        h1 { margin-top: 0; }
        form { max-width: 420px; margin: 25px auto; text-align: left; }
        label { font-weight: bold; }
        input {
            width: 100%; padding: 12px; margin-top: 6px;
            border: 3px solid #111; font-size: 16px;
        }
        button {
            width: 100%; padding: 13px; margin-top: 18px;
            border: 3px solid #111; background: #ffd43b;
            font-weight: bold; font-size: 17px; cursor: pointer;
        }
        .resultado {
            margin-top: 25px; padding: 18px;
            border: 4px solid #111; background: white;
        }
        .pixel-gif {
            width: 256px;
            height: 256px;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #111;
            display: block;
            margin: 18px auto 0;
        }
        .erro { color: #b00020; font-weight: bold; }
        .obs { font-size: 12px; color: #666; }
    </style>
</head>
<body>
<main class="container">
    <h1>🎮 IMC | Índice de Massa Corporal</h1>

    <form action="/imc" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="massa">Informe sua massa em kg:</label>
        <input type="number" id="massa" name="massa" step="0.01" min="1" required>

        <br><br>

        <label for="altura">Informe sua altura em metros:</label>
        <input type="number" id="altura" name="altura" step="0.01" min="0.5" required>

        <button type="submit">CALCULAR IMC</button>
    </form>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    {% if result %}
        <section class="resultado">
            <h2>Resultado</h2>
            <p>{{ result }}</p>
            <img class="pixel-gif"
                 src="{{ url_for('static', filename='gifs/' + gif) }}"
                 alt="GIF em pixel art referente à classificação do IMC"
                 width="256" height="256">
            <p class="obs">O IMC é uma medida de referência e não substitui uma avaliação profissional.</p>
        </section>
    {% endif %}
</main>
</body>
</html>
