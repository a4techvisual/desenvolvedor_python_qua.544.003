{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-content">

        <div class="col-md-8">

            <div class="card p-4 shadow-lg">

                <h2 class="card-title text-center mb-4">
                    Resultado da extração de texto
                </h2>

                <div class="mb-3">

                    <label for="texto" class="form-label">
                        Texto extraído da imagem:
                    </label>

                    <textarea
                        class="form-control"
                        name="texto"
                        id="texto"
                        rows="10"
                    >{{ texto or '' }}</textarea>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
